<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agriculture Price Prediction</title>
</head>
<body>
    <h2>Agriculture Price Prediction</h2>

    <form method="POST">
        <label>State:</label> <input type="text" name="state" required><br><br>
        <label>District:</label> <input type="text" name="district" required><br><br>
        <label>Market:</label> <input type="text" name="market" required><br><br>
        <label>Commodity:</label> <input type="text" name="commodity" required><br><br>
        <label>Grade:</label> <input type="text" name="grade" required><br><br>
        <label>Day:</label> <input type="number" name="day" required><br><br>
        <label>Month:</label> <input type="number" name="month" required><br><br>
        <label>Year:</label> <input type="number" name="year" required><br><br>
        <label>Minimum Price:</label> <input type="number" name="min_price" step="0.01" required><br><br>
        
        <button type="submit">Predict</button>
    </form>

    {% if error_message %}
        <h3 style="color: red;">{{ error_message }}</h3>
    {% endif %}

    {% if predicted_price is not none %}
        <h3>Predicted Price: ₹{{ predicted_price }}</h3>
    {% endif %}

</body>
</html>
