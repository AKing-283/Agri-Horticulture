<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .header {
            background-color: #90ee90;
            color: black;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .footer {
            background-color: #2d572c;
            color: white;
            text-align: center;
            padding: 5px;
            margin-top: 120px;
            position: relative;
            bottom: 0;
            width: 100%;
            font-size: 14px;
        }
        .btn-custom {
            background-color: #90ee90;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .btn-custom:hover {
            background-color: #7ed957;
        }
        .prediction-box {
            background-color: #e6f7e6;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #2d572c;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Agri-Horticultural Commodity Price Prediction</h2>
    </div>
    <main class="container mt-5">
        <form id="price-prediction-form">
            <div class="row mt-4">
                <div class="col-md-4">
                    <label for="commodity" class="form-label">Select Commodity</label>
                    <input type="text" id="commodity" class="form-control" placeholder="Enter Commodity" required>
                </div>
                <div class="col-md-4">
                    <label for="state" class="form-label">Select State</label>
                    <input type="text" id="state" class="form-control" placeholder="Enter State" required>
                </div>
                <div class="col-md-4">
                    <label for="district" class="form-label">Enter District</label>
                    <input type="text" id="district" class="form-control" placeholder="Enter District" required>
                </div>
            </div>
            <br>
            <div class="row mt-3">
                <div class="col-md-4">
                    <label for="market" class="form-label">Enter Market</label>
                    <input type="text" id="market" class="form-control" placeholder="Enter Market" required>
                </div>
                <div class="col-md-4">
                    <label for="grade" class="form-label">Enter Grade</label>
                    <input type="text" id="grade" class="form-control" placeholder="Enter Grade" required>
                </div>
                <div class="col-md-4">
                    <label for="year" class="form-label">Select Year</label>
                    <input type="number" id="year" class="form-control" placeholder="Enter Year" required>
                </div>
            </div>
            <br>
            <div class="row mt-3">
                <div class="col-md-4">
                    <label for="month" class="form-label">Select Month</label>
                    <input type="number" id="month" class="form-control" placeholder="Enter Month" required>
                </div>
                <div class="col-md-4">
                    <label for="day" class="form-label">Select Day</label>
                    <input type="number" id="day" class="form-control" placeholder="Enter Day" required>
                </div>
                <div class="col-md-4">
                    <label for="min_price" class="form-label">Minimum Price (₹ per 100kg)</label>
                    <input type="number" step="0.01" id="min_price" class="form-control" placeholder="Enter Min Price" required>
                </div>
            </div>
            <br>
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-custom">Predict Price</button>
            </div>
        </form>

        <!-- Prediction Output Section -->
        <div>{% if predicted_price is not none %}
        <h4>Predicted Price (per Quintal): ₹{{ predicted_price }}</h4>
        {% endif %}</div>
        </div>
    </main>
    <br><br><br>
    <footer class="footer">
        <p>&copy; 2025 Price Prediction System. All Rights Reserved.</p>
    </footer>

    <script>
        document.getElementById("price-prediction-form").addEventListener("submit", function(event) {
            event.preventDefault();
            
            let formData = {
                commodity: document.getElementById("commodity").value,
                state: document.getElementById("state").value,
                district: document.getElementById("district").value,
                market: document.getElementById("market").value,
                grade: document.getElementById("grade").value,
                year: document.getElementById("year").value,
                month: document.getElementById("month").value,
                day: document.getElementById("day").value
            };
    
            console.log("Sending data:", formData);  // Debugging: Check data before sending
    
            fetch("http://127.0.0.1:5000", {  // ✅ Ensure the URL is correct
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                console.log("Received response:", data);  // Debugging: Check response
    
                let predictionBox = document.getElementById("prediction-box");
                let predictionResult = document.getElementById("prediction-result");
    
                if (data.predicted_price) {
                    predictionResult.innerHTML = "Predicted Price: ₹" + data.predicted_price.toFixed(2) + " per 100kg";
                    predictionBox.style.display = "block";  // Show result
                } else {
                    predictionResult.innerHTML = "Error: " + data.error;
                    predictionBox.style.display = "block";  // Show error message
                }
            })
            .catch(error => {
                console.error("Fetch Error:", error);
                document.getElementById("prediction-result").innerHTML = "Error: Unable to get prediction.";
                document.getElementById("prediction-box").style.display = "block";
            });
        });
    </script>
    

</body>
</html>
